<title>Eduardo Motors CRM</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Sans:wght@400;500&display=swap">

<style>
/* === TOKENS === */
:root {
  /* Layout: sidebar nav + kanban columns side-scroll */
  --bg: #f0f2f5;
  --surface: #ffffff;
  --surface2: #f7f8fa;
  --border: #e2e5ea;
  --fg: #111827;
  --fg2: #4b5563;
  --fg3: #9ca3af;
  --accent: #1a56db;
  --accent-soft: #eff4ff;
  --accent-fg: #ffffff;
  --red: #dc2626;
  --red-soft: #fef2f2;
  --green: #16a34a;
  --green-soft: #f0fdf4;
  --orange: #ea580c;
  --orange-soft: #fff7ed;
  --yellow: #ca8a04;
  --yellow-soft: #fefce8;
  --purple: #7c3aed;
  --purple-soft: #f5f3ff;
  --gray-soft: #f3f4f6;
  --shadow-sm: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
  --shadow: 0 4px 12px rgba(0,0,0,.08);
  --radius: 10px;
  --radius-sm: 6px;
  --font-head: 'Inter', system-ui, sans-serif;
  --font-body: 'DM Sans', system-ui, sans-serif;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1117;
    --surface: #1a1d26;
    --surface2: #22263a;
    --border: #2d3148;
    --fg: #f1f5f9;
    --fg2: #94a3b8;
    --fg3: #64748b;
    --accent: #3b82f6;
    --accent-soft: #1e2a4a;
    --accent-fg: #ffffff;
    --red-soft: #2d1515;
    --green-soft: #132112;
    --orange-soft: #2d1a0a;
    --yellow-soft: #2a2010;
    --purple-soft: #1e1535;
    --gray-soft: #1e2130;
    --shadow-sm: 0 1px 3px rgba(0,0,0,.3);
    --shadow: 0 4px 12px rgba(0,0,0,.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1117;
  --surface: #1a1d26;
  --surface2: #22263a;
  --border: #2d3148;
  --fg: #f1f5f9;
  --fg2: #94a3b8;
  --fg3: #64748b;
  --accent: #3b82f6;
  --accent-soft: #1e2a4a;
  --accent-fg: #ffffff;
  --red-soft: #2d1515;
  --green-soft: #132112;
  --orange-soft: #2d1a0a;
  --yellow-soft: #2a2010;
  --purple-soft: #1e1535;
  --gray-soft: #1e2130;
  --shadow-sm: 0 1px 3px rgba(0,0,0,.3);
  --shadow: 0 4px 12px rgba(0,0,0,.4);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  font-family: var(--font-body);
  font-size: 14px;
  background: var(--bg);
  color: var(--fg);
  overflow: hidden;
}

/* === APP SHELL === */
.app {
  display: flex;
  height: 100%;
  overflow: hidden;
}

/* === SIDEBAR === */
.sidebar {
  width: 220px;
  flex-shrink: 0;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transition: width .25s ease;
}
.sidebar.collapsed { width: 56px; }

.sidebar-logo {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 18px 16px;
  border-bottom: 1px solid var(--border);
  min-height: 60px;
}
.logo-icon {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  background: var(--accent);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  color: #fff;
  font-size: 16px;
  font-weight: 700;
  font-family: var(--font-head);
}
.logo-text {
  font-family: var(--font-head);
  font-size: 13px;
  font-weight: 700;
  line-height: 1.2;
  white-space: nowrap;
  overflow: hidden;
}
.logo-text span { display: block; color: var(--fg3); font-weight: 400; font-size: 11px; }

.sidebar-nav {
  flex: 1;
  padding: 8px 8px;
  overflow-y: auto;
  overflow-x: hidden;
}
.nav-section {
  margin-bottom: 20px;
}
.nav-label {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--fg3);
  padding: 4px 8px;
  white-space: nowrap;
  overflow: hidden;
}
.sidebar.collapsed .nav-label { opacity: 0; }
.nav-item {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 8px 8px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  color: var(--fg2);
  font-size: 13.5px;
  font-weight: 500;
  white-space: nowrap;
  text-decoration: none;
  transition: background .12s, color .12s;
  overflow: hidden;
}
.nav-item:hover { background: var(--surface2); color: var(--fg); }
.nav-item.active { background: var(--accent-soft); color: var(--accent); }
.nav-icon { font-size: 16px; flex-shrink: 0; width: 20px; text-align: center; }
.nav-badge {
  margin-left: auto;
  background: var(--accent);
  color: #fff;
  font-size: 10px;
  font-weight: 700;
  padding: 1px 6px;
  border-radius: 20px;
  font-variant-numeric: tabular-nums;
}
.sidebar.collapsed .nav-badge { display: none; }

.sidebar-bottom {
  padding: 12px 8px;
  border-top: 1px solid var(--border);
}
.collapse-btn {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 8px 8px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  color: var(--fg3);
  font-size: 13px;
  background: none;
  border: none;
  width: 100%;
  white-space: nowrap;
  overflow: hidden;
  transition: background .12s, color .12s;
}
.collapse-btn:hover { background: var(--surface2); color: var(--fg2); }
.collapse-icon { font-size: 16px; flex-shrink: 0; transition: transform .25s; }
.sidebar.collapsed .collapse-icon { transform: rotate(180deg); }

/* === MAIN === */
.main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* === TOPBAR === */
.topbar {
  height: 60px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 20px;
  flex-shrink: 0;
}
.topbar-title {
  font-family: var(--font-head);
  font-size: 16px;
  font-weight: 700;
  flex: 1;
}
.topbar-sub { font-size: 13px; color: var(--fg3); font-weight: 400; margin-left: 6px; }

.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 14px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 600;
  font-family: var(--font-body);
  cursor: pointer;
  border: none;
  transition: opacity .12s, transform .08s;
}
.btn:active { transform: scale(.97); }
.btn-primary { background: var(--accent); color: var(--accent-fg); }
.btn-primary:hover { opacity: .88; }
.btn-ghost { background: transparent; color: var(--fg2); border: 1px solid var(--border); }
.btn-ghost:hover { background: var(--surface2); }
.btn-danger { background: var(--red); color: #fff; }
.btn-danger:hover { opacity: .88; }
.btn-sm { padding: 5px 10px; font-size: 12px; }
.btn-icon { padding: 7px; }

/* === VIEWS === */
.view { display: none; flex: 1; overflow: hidden; }
.view.active { display: flex; flex-direction: column; }

/* === DASHBOARD === */
.dashboard-content {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 14px;
}
.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 18px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.stat-label {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .07em;
  color: var(--fg3);
}
.stat-value {
  font-family: var(--font-head);
  font-size: 28px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  line-height: 1;
  margin-top: 4px;
}
.stat-sub { font-size: 12px; color: var(--fg3); margin-top: 2px; }
.stat-accent { color: var(--accent); }
.stat-green { color: var(--green); }
.stat-orange { color: var(--orange); }
.stat-red { color: var(--red); }

.section-title {
  font-family: var(--font-head);
  font-size: 14px;
  font-weight: 700;
  margin-bottom: 12px;
  color: var(--fg);
}

.funnel-chart {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px 20px;
}
.funnel-bars {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 12px;
}
.funnel-row {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 12.5px;
}
.funnel-stage-name {
  width: 140px;
  flex-shrink: 0;
  font-weight: 500;
  color: var(--fg2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.funnel-bar-wrap {
  flex: 1;
  height: 22px;
  background: var(--surface2);
  border-radius: 4px;
  overflow: hidden;
  min-width: 0;
}
.funnel-bar {
  height: 100%;
  border-radius: 4px;
  transition: width .5s ease;
}
.funnel-count {
  width: 28px;
  text-align: right;
  font-variant-numeric: tabular-nums;
  font-weight: 600;
  color: var(--fg);
  flex-shrink: 0;
}

.recent-leads {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.recent-leads table { width: 100%; border-collapse: collapse; }
.recent-leads th {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .07em;
  color: var(--fg3);
  padding: 10px 16px;
  text-align: left;
  background: var(--surface2);
  border-bottom: 1px solid var(--border);
}
.recent-leads td {
  padding: 11px 16px;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
  color: var(--fg);
  vertical-align: middle;
}
.recent-leads tr:last-child td { border-bottom: none; }
.recent-leads tr:hover td { background: var(--surface2); cursor: pointer; }

/* === KANBAN === */
.kanban-toolbar {
  padding: 12px 20px;
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.search-input {
  flex: 1;
  max-width: 300px;
  padding: 7px 12px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--surface2);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 13px;
}
.search-input:focus { outline: 2px solid var(--accent); }
.filter-select {
  padding: 7px 10px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--surface2);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 13px;
  cursor: pointer;
}

.kanban-board {
  flex: 1;
  overflow-x: auto;
  padding: 16px 20px;
  display: flex;
  gap: 14px;
  align-items: flex-start;
}

.kanban-col {
  flex-shrink: 0;
  width: 260px;
  display: flex;
  flex-direction: column;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  max-height: calc(100vh - 190px);
}
.col-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 11px 14px;
  font-weight: 700;
  font-family: var(--font-head);
  font-size: 12.5px;
  text-transform: uppercase;
  letter-spacing: .05em;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  flex-shrink: 0;
}
.col-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.col-count {
  margin-left: auto;
  font-size: 11px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 20px;
  background: var(--border);
  color: var(--fg2);
}
.col-cards {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.lead-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px;
  cursor: pointer;
  transition: box-shadow .12s, transform .1s;
  box-shadow: var(--shadow-sm);
}
.lead-card:hover { box-shadow: var(--shadow); transform: translateY(-1px); }
.lead-name {
  font-weight: 600;
  font-size: 13.5px;
  margin-bottom: 4px;
  font-family: var(--font-head);
}
.lead-veiculo {
  font-size: 12px;
  color: var(--fg3);
  margin-bottom: 8px;
}
.lead-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
}
.lead-origem {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  font-weight: 500;
  padding: 2px 7px;
  border-radius: 20px;
}
.lead-data { font-size: 11px; color: var(--fg3); }
.lead-valor {
  font-size: 12px;
  font-weight: 600;
  color: var(--green);
  font-variant-numeric: tabular-nums;
}

/* === ORIGEM BADGES === */
.origem-meta { background: var(--accent-soft); color: var(--accent); }
.origem-google { background: var(--red-soft); color: var(--red); }
.origem-indicacao { background: var(--green-soft); color: var(--green); }
.origem-organico { background: var(--orange-soft); color: var(--orange); }
.origem-outro { background: var(--gray-soft); color: var(--fg3); }

/* === MODAL === */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.45);
  backdrop-filter: blur(3px);
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.modal {
  background: var(--surface);
  border-radius: var(--radius);
  box-shadow: 0 20px 60px rgba(0,0,0,.25);
  width: 100%;
  max-width: 520px;
  max-height: 90vh;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}
.modal-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 18px 20px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.modal-title {
  font-family: var(--font-head);
  font-size: 15px;
  font-weight: 700;
  flex: 1;
}
.modal-body { padding: 20px; flex: 1; overflow-y: auto; }
.modal-footer {
  padding: 14px 20px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 8px;
  justify-content: flex-end;
  flex-shrink: 0;
}

.form-group { margin-bottom: 14px; }
.form-label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .07em;
  color: var(--fg3);
  margin-bottom: 5px;
}
.form-input, .form-select, .form-textarea {
  width: 100%;
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--surface2);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 13.5px;
  transition: border-color .12s;
}
.form-input:focus, .form-select:focus, .form-textarea:focus {
  outline: none;
  border-color: var(--accent);
}
.form-textarea { min-height: 80px; resize: vertical; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

/* Ficha do lead */
.lead-detail-header {
  background: var(--surface2);
  border-radius: var(--radius-sm);
  padding: 14px;
  margin-bottom: 16px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.lead-detail-name {
  font-family: var(--font-head);
  font-size: 18px;
  font-weight: 700;
}
.lead-detail-meta { display: flex; flex-wrap: wrap; gap: 8px; }
.detail-badge {
  font-size: 12px;
  font-weight: 500;
  padding: 3px 10px;
  border-radius: 20px;
  background: var(--accent-soft);
  color: var(--accent);
}

.stage-selector {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 16px;
}
.stage-btn {
  padding: 5px 12px;
  border-radius: 20px;
  border: 1px solid var(--border);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  background: var(--surface2);
  color: var(--fg2);
  font-family: var(--font-body);
  transition: all .12s;
}
.stage-btn.active-stage {
  border-color: transparent;
  color: #fff;
  font-weight: 600;
}

.notes-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 10px;
}
.note-item {
  background: var(--surface2);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  font-size: 13px;
  border-left: 3px solid var(--accent);
}
.note-date { font-size: 11px; color: var(--fg3); margin-top: 4px; }

/* === TOAST === */
.toast-container {
  position: fixed;
  bottom: 20px;
  right: 20px;
  z-index: 999;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.toast {
  background: var(--fg);
  color: var(--bg);
  padding: 10px 16px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 500;
  box-shadow: var(--shadow);
  animation: slideUp .2s ease;
  max-width: 300px;
}
@keyframes slideUp {
  from { transform: translateY(10px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
.toast.success { background: var(--green); color: #fff; }
.toast.error { background: var(--red); color: #fff; }

/* === LOADING === */
.loading-overlay {
  display: flex;
  align-items: center;
  justify-content: center;
  flex: 1;
  flex-direction: column;
  gap: 12px;
  color: var(--fg3);
}
.spinner {
  width: 32px;
  height: 32px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* === EMPTY STATE === */
.empty-col {
  text-align: center;
  padding: 24px 12px;
  color: var(--fg3);
  font-size: 12.5px;
}
.empty-col-icon { font-size: 24px; margin-bottom: 6px; }

/* === CONFIRM === */
.confirm-box {
  background: var(--red-soft);
  border: 1px solid var(--red);
  border-radius: var(--radius-sm);
  padding: 12px;
  margin-bottom: 14px;
  font-size: 13px;
  color: var(--red);
}

/* === RESPONSIVE === */
@media (max-width: 640px) {
  .sidebar { width: 56px; }
  .logo-text, .nav-item span:not(.nav-icon), .nav-badge, .collapse-btn span { display: none; }
  .form-row { grid-template-columns: 1fr; }
  .stats-grid { grid-template-columns: 1fr 1fr; }
}
</style>

<!-- Supabase JS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>

<div class="app">
  <!-- SIDEBAR -->
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">EM</div>
      <div class="logo-text">
        Eduardo Motors
        <span>CRM de Leads</span>
      </div>
    </div>
    <div class="sidebar-nav">
      <div class="nav-section">
        <div class="nav-label">Menu</div>
        <div class="nav-item active" onclick="showView('dashboard')">
          <span class="nav-icon">📊</span>
          <span>Dashboard</span>
        </div>
        <div class="nav-item" onclick="showView('kanban')">
          <span class="nav-icon">🗂️</span>
          <span>Funil de Vendas</span>
          <span class="nav-badge" id="badge-total">0</span>
        </div>
        <div class="nav-item" onclick="showView('kanban'); filterByEtapa('novo_lead')">
          <span class="nav-icon">🆕</span>
          <span>Novos Leads</span>
          <span class="nav-badge" id="badge-novos">0</span>
        </div>
      </div>
      <div class="nav-section">
        <div class="nav-label">Ação Rápida</div>
        <div class="nav-item" onclick="openNovoLeadModal()">
          <span class="nav-icon">➕</span>
          <span>Novo Lead</span>
        </div>
      </div>
    </div>
    <div class="sidebar-bottom">
      <button class="collapse-btn" onclick="toggleSidebar()">
        <span class="collapse-icon">◀</span>
        <span>Recolher</span>
      </button>
    </div>
  </nav>

  <!-- MAIN -->
  <div class="main">
    <!-- TOPBAR -->
    <div class="topbar">

<script>

const ETAPAS = [

async function refreshData() {
  try {
    const { data, error } = await supabase.from('leads').select('*').order('created_at', { ascending: false });
    if (error) throw error;
    leads = data || [];
    renderDashboard();
    renderKanban();
    updateBadges();
  } catch (e) {
    toast('Erro ao carregar dados: ' + e.message, 'error');

}

// ============================================================
// DASHBOARD
// ============================================================
function renderDashboard() {
  const total = leads.length;
  const fechados = leads.filter(l => l.etapa_funil === 'fechado').length;
  const perdidos = leads.filter(l => l.etapa_funil === 'perdido').length;
  const ativos = total - fechados - perdidos;
  const taxa = total > 0 ? Math.round((fechados / total) * 100) : 0;
  const valorTotal = leads.filter(l => l.etapa_funil === 'fechado' && l.valor_estimado)
    .reduce((s, l) => s + parseFloat(l.valor_estimado), 0);

  const etapaCounts = {};
  ETAPAS.forEach(e => { etapaCounts[e.id] = leads.filter(l => l.etapa_funil === e.id).length; });
  const maxCount = Math.max(...Object.values(etapaCounts), 1);

  // Recentes
  const recentes = [...leads].slice(0, 8);

  document.getElementById('dashboard-content').innerHTML = `
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Total de Leads</div>
        <div class="stat-value stat-accent">${total}</div>
        <div class="stat-sub">${ativos} em andamento</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Fechados</div>
        <div class="stat-value stat-green">${fechados}</div>
        <div class="stat-sub">Conversões realizadas</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Taxa de Conversão</div>
        <div class="stat-value stat-accent">${taxa}%</div>
        <div class="stat-sub">Leads → Vendas</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Receita Fechada</div>
        <div class="stat-value stat-green" style="font-size:22px">R$ ${valorTotal.toLocaleString('pt-BR', {minimumFractionDigits:0})}</div>
        <div class="stat-sub">Valor estimado</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Perdidos</div>
        <div class="stat-value stat-red">${perdidos}</div>
        <div class="stat-sub">Taxa: ${total > 0 ? Math.round((perdidos/total)*100) : 0}%</div>
      </div>
    </div>

    <div class="funnel-chart">
      <div class="section-title">Funil de Conversão</div>
      <div class="funnel-bars">
        ${ETAPAS.map(e => `
          <div class="funnel-row">
            <div class="funnel-stage-name">${e.label}</div>
            <div class="funnel-bar-wrap">
              <div class="funnel-bar" style="width:${Math.round((etapaCounts[e.id]/maxCount)*100)}%;background:${e.cor}"></div>
            </div>
            <div class="funnel-count">${etapaCounts[e.id]}</div>
          </div>
        `).join('')}
      </div>
    </div>

    ${recentes.length > 0 ? `
    <div class="recent-leads">
      <div class="section-title" style="padding:14px 16px 0">Leads Recentes</div>
      <table>
        <thead>
          <tr>
            <th>Nome</th>
            <th>Veículo</th>
            <th>Origem</th>
            <th>Etapa</th>
            <th>Data</th>
          </tr>
        </thead>
        <tbody>
          ${recentes.map(l => `
            <tr onclick="abrirFicha('${l.id}')">
              <td><strong>${esc(l.nome)}</strong></td>
              <td>${esc(l.veiculo_interesse || '—')}</td>
              <td><span class="lead-origem ${origemClass(l.origem_anuncio)}">${esc(l.origem_anuncio || 'Outro')}</span></td>
              <td>${etapaLabel(l.etapa_funil)}</td>
              <td style="color:var(--fg3)">${formatDate(l.created_at)}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>` : ''}
  `;
}

// ============================================================
// KANBAN
// ============================================================
function renderKanban() {
  const q = document.getElementById('search-input').value.toLowerCase();
  const origem = document.getElementById('filter-origem').value;

  const filtrados = leads.filter(l => {
    const matchQ = !q || l.nome.toLowerCase().includes(q) || (l.veiculo_interesse||'').toLowerCase().includes(q);
    const matchO = !origem || l.origem_anuncio === origem;
    return matchQ && matchO;
  });

  const board = document.getElementById('kanban-board');
  board.innerHTML = ETAPAS.map(etapa => {
    const cards = filtrados.filter(l => l.etapa_funil === etapa.id);
    return `
      <div class="kanban-col">
        <div class="col-header">
          <div class="col-dot" style="background:${etapa.cor}"></div>
          ${etapa.label}
          <div class="col-count">${cards.length}</div>
        </div>
        <div class="col-cards">
          ${cards.length === 0
            ? `<div class="empty-col"><div class="empty-col-icon">◎</div>Nenhum lead</div>`
            : cards.map(l => `
              <div class="lead-card" onclick="abrirFicha('${l.id}')">
                <div class="lead-name">${esc(l.nome)}</div>
                <div class="lead-veiculo">${esc(l.veiculo_interesse || 'Veículo não informado')}</div>
                <div class="lead-footer">
                  <span class="lead-origem ${origemClass(l.origem_anuncio)}">${esc(l.origem_anuncio || 'Outro')}</span>
                  ${l.valor_estimado ? `<span class="lead-valor">R$ ${parseFloat(l.valor_estimado).toLocaleString('pt-BR')}</span>` : `<span class="lead-data">${formatDate(l.created_at)}</span>`}
                </div>
              </div>
            `).join('')}
        </div>
      </div>
    `;
  }).join('');
}

function openNovoLeadModal() {
  leadAtual = null;
  document.getElementById('modal-lead-title').textContent = 'Novo Lead';
  document.getElementById('form-lead').reset();
  document.getElementById('f-id').value = '';

function openEditarLeadModal(lead) {
  leadAtual = lead;
  document.getElementById('modal-lead-title').textContent = 'Editar Lead';
  document.getElementById('f-id').value = lead.id;
  document.getElementById('f-nome').value = lead.nome || '';
  document.getElementById('f-telefone').value = lead.telefone || '';
  document.getElementById('f-veiculo').value = lead.veiculo_interesse || '';
  document.getElementById('f-valor').value = lead.valor_estimado || '';

async function submitLead(e) {
  e.preventDefault();
  const id = document.getElementById('f-id').value;
  const payload = {
    nome: document.getElementById('f-nome').value.trim(),
    telefone: document.getElementById('f-telefone').value.trim(),
    veiculo_interesse: document.getElementById('f-veiculo').value.trim(),
    valor_estimado: parseFloat(document.getElementById('f-valor').value) || null,
    origem_anuncio: document.getElementById('f-origem').value,
    etapa_funil: document.getElementById('f-etapa').value,
    anotacoes: document.getElementById('f-anotacoes').value.trim(),
  };
  try {
    if (id) {
      const { error } = await supabase.from('leads').update(payload).eq('id', id);
      if (error) throw error;
      toast('Lead atualizado!', 'success');
    } else {
      const { error } = await supabase.from('leads').insert(payload);
      if (error) throw error;
      toast('Lead criado!', 'success');
    }
    closeModal('modal-lead');
    await refreshData();
  } catch (err) {
    toast('Erro: ' + err.message, 'error');
  }
}

// FICHA DO LEAD

function abrirFicha(id) {
  const lead = leads.find(l => l.id === id);
  if (!lead) return;
  leadAtual = lead;

  const etapa = ETAPAS.find(e => e.id === lead.etapa_funil);

  document.getElementById('modal-ficha-body').innerHTML = `
    <div class="lead-detail-header">
      <div class="lead-detail-name">${esc(lead.nome)}</div>
      <div class="lead-detail-meta">
        ${lead.telefone ? `<a href="https://wa.me/55${lead.telefone.replace(/\D/g,'')}" target="_blank" class="detail-badge" style="text-decoration:none">📱 ${esc(lead.telefone)}</a>` : ''}
        ${lead.veiculo_interesse ? `<span class="detail-badge" style="background:var(--orange-soft);color:var(--orange)">🚗 ${esc(lead.veiculo_interesse)}</span>` : ''}
        ${lead.origem_anuncio ? `<span class="detail-badge">📢 ${esc(lead.origem_anuncio)}</span>` : ''}
        ${lead.valor_estimado ? `<span class="detail-badge" style="background:var(--green-soft);color:var(--green)">💰 R$ ${parseFloat(lead.valor_estimado).toLocaleString('pt-BR')}</span>` : ''}
      </div>
    </div>

    <div class="form-label">Mover para outra etapa</div>
    <div class="stage-selector">
      ${ETAPAS.map(e => `
        <button class="stage-btn ${e.id === lead.etapa_funil ? 'active-stage' : ''}"
          style="${e.id === lead.etapa_funil ? `background:${e.cor};border-color:${e.cor}` : ''}"
          onclick="moverEtapa('${lead.id}', '${e.id}')">
          ${e.label}
        </button>
      `).join('')}
    </div>

    ${lead.anotacoes ? `
      <div class="form-label" style="margin-top:12px">Anotações</div>
      <div class="notes-list">
        <div class="note-item">
          ${esc(lead.anotacoes)}
          <div class="note-date">Adicionado em ${formatDate(lead.created_at)}</div>
        </div>
      </div>
    ` : '<div style="color:var(--fg3);font-size:13px;text-align:center;padding:16px">Sem anotações</div>'}

    <div style="margin-top:12px;color:var(--fg3);font-size:11px;text-align:right">
      Lead criado em ${formatDateTime(lead.created_at)} · Atualizado ${formatDateTime(lead.updated_at)}
    </div>
  `;

  document.getElementById('modal-ficha').hidden = false;
}

function editarLeadAtual() {
  if (leadAtual) openEditarLeadModal(leadAtual);
}

async function moverEtapa(id, etapa) {
  try {
    const { error } = await supabase.from('leads').update({ etapa_funil: etapa }).eq('id', id);
    if (error) throw error;
    toast('Lead movido!', 'success');
    closeModal('modal-ficha');
    await refreshData();
  } catch (err) {
    toast('Erro: ' + err.message, 'error');
  }
}

// DELETAR
// ============================================================
function confirmarDelecao() {
  const body = document.getElementById('modal-ficha-body');
  // Mostra confirmação inline no modal de edição
  const existing = document.getElementById('confirm-delete-box');
  if (existing) { existing.remove(); return; }
  const box = document.createElement('div');
  box.id = 'confirm-delete-box';
  box.className = 'confirm-box';
  box.innerHTML = `⚠️ Tem certeza que deseja excluir este lead permanentemente?
    <div style="margin-top:8px;display:flex;gap:8px">
      <button class="btn btn-danger btn-sm" onclick="deletarLead()">Sim, excluir</button>
      <button class="btn btn-ghost btn-sm" onclick="document.getElementById('confirm-delete-box').remove()">Cancelar</button>
    </div>`;
  document.querySelector('#modal-lead .modal-body').prepend(box);
}

async function deletarLead() {
  const id = document.getElementById('f-id').value;
  if (!id) return;
  try {
    const { error } = await supabase.from('leads').delete().eq('id', id);
    if (error) throw error;
    toast('Lead excluído!', 'success');
    closeModal('modal-lead');
    await refreshData();
  } catch (err) {
    toast('Erro ao excluir: ' + err.message, 'error');
  }
}

function showView(name) {
  document.querySelectorAll('.view').forEach(v => { v.classList.remove('active'); });
  document.querySelectorAll('.nav-item').forEach(n => { n.classList.remove('active'); });
  document.getElementById('view-' + name).classList.add('active');

  const titles = { dashboard: ['Dashboard', 'Visão geral dos leads'], kanban: ['Funil de Vendas', 'Arraste os cards entre as etapas'] };
  document.getElementById('view-title').childNodes[0].textContent = titles[name][0] + ' ';
  document.getElementById('view-sub').textContent = titles[name][1];
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('collapsed');
}

// ============================================================
// UTILS
// ============================================================
function closeModal(id) {
  document.getElementById(id).hidden = true;
}

function esc(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function origemClass(origem) {
  const map = { 'Meta Ads': 'origem-meta', 'Google Ads': 'origem-google', 'Indicação': 'origem-indicacao', 'Orgânico': 'origem-organico' };
  return map[origem] || 'origem-outro';
}

function etapaLabel(etapa) {
  const e = ETAPAS.find(x => x.id === etapa);
  return e ? `<span style="font-size:12px;color:${e.cor};font-weight:600">${e.label}</span>` : etapa;
}

function formatDate(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleDateString('pt-BR');
}
function formatDateTime(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
}

function toast(msg, type = '') {
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  document.getElementById('toasts').appendChild(t);
  setTimeout(() => t.remove(), 3500);
}

// Fechar modal clicando no backdrop
document.querySelectorAll('.modal-backdrop').forEach(el => {
  el.addEventListener('click', e => { if (e.target === el) el.hidden = true; });
});

// Tecla ESC fecha modal
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.querySelectorAll('.modal-backdrop').forEach(m => { m.hidden = true; });
});
</script>
